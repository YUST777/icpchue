<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your ICPC HUE password</title>
  </head>
  <body style="margin:0;background:#0b0c0d;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',Inter,Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b0c0d;padding:40px 14px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#17191b;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.16);border-radius:24px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 18px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden;">
            <tr>
              <td style="padding:30px 32px 22px;">
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="width:42px;height:42px;vertical-align:middle;">
                      <img src="https://www.icpchue.com/icpchue-logo.webp" width="42" height="42" alt="" style="display:block;border:0;" />
                    </td>
                    <td style="padding-left:12px;vertical-align:middle;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#d7d9dc;">ICPC HUE</td>
                  </tr>
                </table>
                <h1 style="margin:30px 0 10px;font-size:28px;line-height:1.2;letter-spacing:-.02em;color:#ffffff;">Reset your password</h1>
                <p style="margin:0;font-size:16px;line-height:1.6;color:#b7bbc0;">Tap the button below to choose a new password for your ICPC HUE account.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 32px 10px;">
                <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery" style="display:block;padding:15px 18px;text-align:center;background:#e8c15a;border-radius:14px;color:#15120c;font-size:16px;font-weight:700;text-decoration:none;">Choose a new password</a>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 30px;">
                <p style="margin:0;font-size:14px;line-height:1.6;color:#aeb2b7;">This link expires in one hour and works once. If you did not request it, you can safely ignore this email.</p>
                <p style="margin:22px 0 0;font-size:12px;line-height:1.5;color:#747980;">This message was sent to {{ .Email }}.</p>
              </td>
            </tr>
          </table>
          <p style="margin:18px 0 0;font-size:11px;line-height:1.5;color:#686d73;">ICPC HUE Community</p>
        </td>
      </tr>
    </table>
  </body>
</html>
