<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your ICPC HUE account</title>
  </head>
  <body style="margin:0;background:#f5f6f3;color:#172019;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f5f6f3;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e4e8e1;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 12px;">
                <div style="font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#57724c;">ICPC HUE</div>
                <h1 style="margin:18px 0 10px;font-size:28px;line-height:1.2;color:#172019;">Verify your email</h1>
                <p style="margin:0;font-size:16px;line-height:1.6;color:#5c665c;">Use this code to continue your ICPC HUE registration.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 8px;">
                <div style="padding:20px;text-align:center;background:#f0f5ed;border:1px solid #d7e4d1;border-radius:10px;">
                  <div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6a7767;">Verification code</div>
                  <div style="margin-top:10px;font-size:36px;line-height:1;font-weight:700;letter-spacing:.24em;color:#314d2c;">{{ .Token }}</div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 30px;">
                <p style="margin:0;font-size:14px;line-height:1.6;color:#6a736a;">This code expires soon. If you did not request it, you can safely ignore this email.</p>
                <p style="margin:22px 0 0;font-size:13px;line-height:1.5;color:#879087;">This message was sent to {{ .Email }}.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
