# Nginx configuration for Docker
# HTTP -> HTTPS redirect handled by upstream load balancer/Cloudflare

upstream frontend {
    server icpchue-frontend:3000;
}

upstream verdict_frontend {
    server verdict-frontend:3000;
}

upstream backend {
    server icpchue-backend:3001;
}

upstream judge0 {
    server judge0-server:2358;
}

upstream rybbit_client {
    server rybbit-client:3002;
}

upstream rybbit_backend {
    server rybbit-backend:3001;
}

# ===========================================
# ICPCHUE.COM - HTTP -> HTTPS
# ===========================================
server {
    listen 80;
    server_name icpchue.com www.icpchue.com;
    return 301 https://icpchue.com$request_uri;
}

# ===========================================
# ICPCHUE.XYZ -> ICPCHUE.COM redirect (HTTP)
# ===========================================
server {
    listen 80;
    server_name icpchue.xyz www.icpchue.xyz;
    return 301 https://icpchue.com$request_uri;
}

# ===========================================
# ICPCHUE.XYZ -> ICPCHUE.COM redirect (SSL)
# ===========================================
server {
    listen 443 ssl;
    server_name icpchue.xyz www.icpchue.xyz;

    ssl_certificate /etc/letsencrypt/live/icpchue.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icpchue.xyz/privkey.pem;

    return 301 https://icpchue.com$request_uri;
}

# ===========================================
# VERDICT.RUN - HTTP -> HTTPS
# ===========================================
server {
    listen 80;
    server_name verdict.run www.verdict.run codeforces.verdict.run codeforess.verdict.run;
    return 301 https://$host$request_uri;
}

# ===========================================
# ICPCHUE.COM - SSL
# ===========================================
server {
    listen 443 ssl;
    server_name icpchue.com www.icpchue.com;
    
    ssl_certificate /etc/letsencrypt/live/icpchue.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icpchue.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    
    client_max_body_size 50M;

    # Netdata Stub Status
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    # SAST Windows installer (public URL; avoids misconfigured CF → download.sast.tech)
    location = /sast-ai-windows-setup.exe {
        alias /var/www/sast-installers/SAST.ai-Setup-0.0.72.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="SAST.ai-Setup-0.0.72.exe"' always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, private' always;
        add_header CDN-Cache-Control 'no-store' always;
        limit_except GET HEAD { deny all; }
        sendfile on;
        tcp_nopush on;
    }

    # Profile pictures
    location ^~ /pfps/ {
        root /var/www;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Rybbit Analytics Proxies (Direct to Backend)
    location = /api/rybbit/script.js {
        proxy_pass http://rybbit_backend/api/script.js;
        proxy_http_version 1.1;
        proxy_set_header Host rybbit.yust.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/rybbit/track {
        proxy_pass http://rybbit_backend/api/track;
        proxy_http_version 1.1;
        proxy_set_header Host rybbit.yust.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/rybbit/site/tracking-config/(.*)$ {
        proxy_pass http://rybbit_backend/api/site/tracking-config/$1;
        proxy_http_version 1.1;
        proxy_set_header Host rybbit.yust.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/rybbit/identify {
        proxy_pass http://rybbit_backend/api/identify;
        proxy_http_version 1.1;
        proxy_set_header Host rybbit.yust.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes - Next.js
    location ~ ^/api/(admin|curriculum|auth|codeforces|mirror|workspace|get-ip|profile|submit-application|training-sheets|submissions|leaderboard|sheets|judge|stats|analyze-complexity|user|recap|views|achievements|news|health|notifications|track|analytics|video|team) {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Security Headers for API
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # API routes - Backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;

        # Security Headers for API
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Judge0
    location /judge0/ {
        rewrite ^/judge0/(.*)$ /$1 break;
        proxy_pass http://judge0;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;

        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 32k;
        
        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: blob:; media-src 'self' https: data: blob:; frame-src 'self' https://drive.google.com https://www.youtube.com https://www.google.com https://www.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}

# ===========================================
# RYBBIT.YUST.DEV - HTTP -> HTTPS
# ===========================================
server {
    listen 80;
    server_name rybbit.yust.dev;
    
    location /.well-known/acme-challenge/ {
        root /var/www/pfps;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ===========================================
# RYBBIT.YUST.DEV - SSL
# ===========================================
server {
    listen 443 ssl;
    server_name rybbit.yust.dev;
    
    ssl_certificate /etc/letsencrypt/live/rybbit.yust.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rybbit.yust.dev/privkey.pem;

    location / {
        proxy_pass http://rybbit_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://rybbit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===========================================
# VERDICT.RUN - SSL
# ===========================================
server {
    listen 443 ssl;
    server_name verdict.run www.verdict.run codeforces.verdict.run codeforess.verdict.run;
    
    ssl_certificate /etc/letsencrypt/live/verdict.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verdict.run/privkey.pem;
    
    client_max_body_size 50M;

    location / {
        proxy_pass http://verdict_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;

        # Fix 502: Supabase auth cookies exceed default 4k buffer
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 32k;
    }
}

# ===========================================
# DOWNLOAD.SAST.TECH - Windows installer (.exe from this VPS)
# HTTP origin (Cloudflare "Flexible").
# HTTPS uses self-signed cert at ./ssl/sast-download/ (works with CF "Full" not "Strict").
# ===========================================
server {
    listen 80;
    server_name download.sast.tech sast.tech www.sast.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/sast-installers;
        default_type text/plain;
        allow all;
    }

    location = / {
        return 307 /installer.exe;
    }

    # Canonical short path (fresh URL — avoids stale Cloudflare cache on old paths)
    location = /installer.exe {
        alias /var/www/sast-installers/SAST.ai-Setup-0.0.72.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="SAST.ai-Setup-0.0.72.exe"' always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, private' always;
        add_header CDN-Cache-Control 'no-store' always;
        limit_except GET HEAD { deny all; }
        sendfile on;
    }

    location = /SAST.ai-Setup-0.0.72.exe {
        alias /var/www/sast-installers/SAST.ai-Setup-0.0.72.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="SAST.ai-Setup-0.0.72.exe"' always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, private' always;
        add_header CDN-Cache-Control 'no-store' always;
        limit_except GET HEAD { deny all; }
        sendfile on;
    }
}

server {
    listen 443 ssl;
    server_name download.sast.tech sast.tech www.sast.tech;

    access_log /dev/stderr main;

    ssl_certificate /etc/nginx/ssl/sast-download/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sast-download/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/sast-installers;
        default_type text/plain;
        allow all;
    }

    location = / {
        return 307 /installer.exe;
    }

    location = /installer.exe {
        alias /var/www/sast-installers/SAST.ai-Setup-0.0.72.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="SAST.ai-Setup-0.0.72.exe"' always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, private' always;
        add_header CDN-Cache-Control 'no-store' always;
        limit_except GET HEAD { deny all; }
        sendfile on;
    }

    location = /SAST.ai-Setup-0.0.72.exe {
        alias /var/www/sast-installers/SAST.ai-Setup-0.0.72.exe;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="SAST.ai-Setup-0.0.72.exe"' always;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, private' always;
        add_header CDN-Cache-Control 'no-store' always;
        limit_except GET HEAD { deny all; }
        sendfile on;
    }
}
