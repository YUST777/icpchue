# Nginx vhost for judge.icpchue.com -> local Judge0 container (127.0.0.1:2358)
# Deployed to /etc/nginx/sites-available/judge0 on the VM, then
# `certbot --nginx -d judge.icpchue.com` fills in the TLS server block.

server {
    listen 80;
    server_name judge.icpchue.com;

    location / {
        proxy_pass http://127.0.0.1:2358;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
